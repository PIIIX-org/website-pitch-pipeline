  <!-- title block -->
  <line x1="24" y1="608" x2="1576" y2="608" stroke="#9CC3E0" stroke-width="1"/>
  <line x1="1100" y1="608" x2="1100" y2="676" stroke="#9CC3E0" stroke-width="1"/>
  <text x="48" y="638" font-size="13" fill="#9CC3E0">PRICES ARE THE ESTIMATOR'S BUILT-IN PER-1M-TOKEN CONSTANTS.</text>
  <text x="48" y="658" font-size="13" fill="#9CC3E0">RERUN `node utils/cost-estimator.js estimate` FOR YOUR OWN CAMPAIGN SIZE.</text>
  <text x="1124" y="634" font-size="16" fill="#f5f9fb">SHEET 00a &#8212; TAKEOFF</text>
  <text x="1124" y="652" font-size="12" fill="#9CC3E0">DERIVED FROM utils/cost-estimator.js</text>
  <text x="1124" y="668" font-size="12" fill="#9CC3E0">5 LEADS / 5 PLANS / 5 SITES</text>
