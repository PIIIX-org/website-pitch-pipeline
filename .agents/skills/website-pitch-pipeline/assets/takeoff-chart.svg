  <rect x="24" y="24" width="1552" height="652" fill="#0E2A3F" stroke="#f5f9fb" stroke-width="1.5"/>
  <rect x="24" y="24" width="1552" height="652" fill="url(#bp-grid)"/>
  <rect x="36" y="36" width="1528" height="572" fill="none" stroke="#2E5C8A" stroke-width="1"/>

  <!-- headline takeaway -->
  <text x="64" y="82" font-size="26" fill="#f5f9fb" textLength="452" lengthAdjust="spacingAndGlyphs">THE SAME JOB: $0.06 &#8212; $32.25.</text>
  <text x="534" y="82" font-size="26" fill="#f5f9fb" textLength="437" lengthAdjust="spacingAndGlyphs">PRICE IT BEFORE YOU TAKE IT.</text>
  <line x1="534" y1="92" x2="971" y2="92" stroke="#B3402F" stroke-width="3"/>
  <text x="64" y="114" font-size="14" fill="#9CC3E0">12 MODELS PRICED AGAINST ONE BILL OF QUANTITIES &#8212; 270,000 TOKENS IN / 376,000 TOKENS OUT</text>

