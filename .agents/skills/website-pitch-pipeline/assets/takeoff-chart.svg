<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Mono', 'Courier New', monospace">
  <title>Takeoff sheet: cost vs quality for 12 models, derived from utils/cost-estimator.js (5 leads / 5 plans / 5 sites)</title>
  <style>
    .anim { animation: plot .5s ease-out backwards; }
    @keyframes plot { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } }
  </style>
  <defs>
    <pattern id="bp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2E5C8A" stroke-width="0.6" opacity="0.28"/>
    </pattern>
  </defs>

  <!-- field + sheet -->
