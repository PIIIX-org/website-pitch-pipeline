  <g stroke="#2E5C8A" stroke-width="1" opacity="0.55">
    <line x1="140" y1="488.6" x2="1460" y2="488.6"/>
    <line x1="140" y1="375.7" x2="1460" y2="375.7"/>
    <line x1="140" y1="262.9" x2="1460" y2="262.9"/>
    <line x1="140" y1="150"   x2="1460" y2="150"/>
    <line x1="276.9"  y1="150" x2="276.9"  y2="545"/>
    <line x1="731.6"  y1="150" x2="731.6"  y2="545"/>
    <line x1="1186.2" y1="150" x2="1186.2" y2="545"/>
    <line x1="1403.2" y1="150" x2="1403.2" y2="545"/>
