<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="hbTitle hbDesc">
  <title id="hbTitle">website-pitch-pipeline — the crew's planning table</title>
  <desc id="hbDesc">Overhead view of a planning table: a cyanotype blueprint of a weak storefront homepage with pencil annotations (no CTA, mobile broken, menu is a JPG), a city grid map pinned at istanbul, berlin and nyc, a torn cost-takeoff slip ($0.06 to $32.25 for the same job), a GATE A go/no-go carbon slip, and a red CHECKED: HUMAN inspection stamp.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lw { stroke-dasharray: 1; stroke-dashoffset: 0; }
    .anim.lw { animation: draw 2.4s cubic-bezier(.45,0,.2,1) backwards; }
    .anim.fade { animation: fadein .9s ease backwards; }
    .d1 { animation-delay: .3s } .d2 { animation-delay: .7s }
    .d3 { animation-delay: 1.1s } .d4 { animation-delay: 1.5s }
    .d5 { animation-delay: 1.9s } .d6 { animation-delay: 2.3s }
    .f1 { animation-delay: .9s } .f2 { animation-delay: 1.4s }
    .f3 { animation-delay: 1.9s } .f4 { animation-delay: 3.1s }
    .anim.stampdrop {
      transform-box: fill-box; transform-origin: 50% 50%;
      animation: stamp .5s cubic-bezier(.2,1.35,.45,1) 4s backwards;
    }
    @keyframes draw { from { stroke-dashoffset: 1 } }
    @keyframes fadein { from { opacity: 0 } }
    @keyframes stamp {
      0% { transform: scale(1.9) rotate(4deg); opacity: 0 }
      60% { transform: scale(.94) rotate(-1deg); opacity: 1 }
      100% { transform: scale(1) rotate(0deg) }
    }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important } }
  </style>

  <!-- table -->
  <rect width="1600" height="420" fill="#272625"/>
  <rect x="0" y="0" width="1600" height="420" fill="url(#vig)"/>
  <defs>
    <radialGradient id="vig" cx="50%" cy="42%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>
  </defs>
  <!-- chalk marks on the table -->
  <g stroke="#f5f9fb" stroke-width="2" opacity="0.22" class="anim fade f2">
    <line x1="1112" y1="72" x2="1130" y2="90"/>
    <line x1="1130" y1="72" x2="1112" y2="90"/>
  </g>
  <path d="M1250,120 C1200,150 1180,150 1148,168" fill="none" stroke="#f5f9fb"
        stroke-width="1.5" stroke-dasharray="6 7" opacity="0.2" class="anim fade f2"/>

  <!-- city grid map (top right, bleeding off edges) -->
  <g class="anim fade f1" transform="translate(1235,-25) rotate(3 200 130)">
    <rect x="8" y="10" width="420" height="260" fill="#000000" opacity="0.28"/>
    <rect x="0" y="0" width="420" height="260" fill="#E3D9BE"/>
    <g stroke="#272625" stroke-width="1.3" opacity="0.3">
      <line x1="30" y1="0" x2="30" y2="260"/><line x1="70" y1="0" x2="70" y2="260"/>
      <line x1="110" y1="0" x2="110" y2="260"/><line x1="150" y1="0" x2="150" y2="260"/>
      <line x1="230" y1="0" x2="230" y2="260"/><line x1="270" y1="0" x2="270" y2="260"/>
      <line x1="310" y1="0" x2="310" y2="260"/><line x1="350" y1="0" x2="350" y2="260"/>
      <line x1="390" y1="0" x2="390" y2="260"/>
      <line x1="0" y1="30" x2="420" y2="30"/><line x1="0" y1="70" x2="420" y2="70"/>
      <line x1="0" y1="150" x2="420" y2="150"/><line x1="0" y1="190" x2="420" y2="190"/>
      <line x1="0" y1="230" x2="420" y2="230"/>
    </g>
    <g stroke="#272625" stroke-width="3" opacity="0.32">
      <line x1="190" y1="0" x2="190" y2="260"/>
      <line x1="0" y1="110" x2="420" y2="110"/>
      <line x1="0" y1="40" x2="420" y2="200"/>
    </g>
    <rect x="232" y="32" width="76" height="36" fill="#272625" opacity="0.08"/>
    <!-- survey pins -->
    <g>
      <circle cx="85" cy="150" r="7" fill="none" stroke="#0E2A3F" stroke-width="2.5"/>
      <circle cx="85" cy="150" r="2.6" fill="#0E2A3F"/>
      <text x="85" y="176" font-size="14" font-weight="bold" fill="#272625" text-anchor="middle">istanbul</text>
      <circle cx="205" cy="60" r="7" fill="none" stroke="#0E2A3F" stroke-width="2.5"/>
      <circle cx="205" cy="60" r="2.6" fill="#0E2A3F"/>
      <text x="205" y="86" font-size="14" font-weight="bold" fill="#272625" text-anchor="middle">berlin</text>
      <circle cx="330" cy="170" r="7" fill="none" stroke="#0E2A3F" stroke-width="2.5"/>
      <circle cx="330" cy="170" r="2.6" fill="#0E2A3F"/>
      <text x="330" y="196" font-size="14" font-weight="bold" fill="#272625" text-anchor="middle">nyc</text>
    </g>
    <!-- tape holding the map down -->
    <rect x="8" y="222" width="58" height="20" fill="#f5f9fb" opacity="0.16" transform="rotate(-38 37 232)"/>
  </g>

  <!-- blueprint sheet -->
  <g transform="translate(55,28) rotate(-1.2 480 182)">
    <rect x="10" y="12" width="950" height="364" fill="#000000" opacity="0.35"/>
    <rect x="0" y="0" width="950" height="364" fill="#0E2A3F"/>
    <rect x="12" y="12" width="926" height="340" fill="none" stroke="#9CC3E0" stroke-width="1.5"
          opacity="0.8" pathLength="1" class="anim lw d1"/>
    <rect x="18" y="18" width="914" height="328" fill="none" stroke="#9CC3E0" stroke-width="0.5"
          opacity="0.5" pathLength="1" class="anim lw d1"/>

    <!-- typed drafting title -->
    <g class="anim fade d1">
      <text x="45" y="84" font-size="44" font-weight="bold" letter-spacing="2" fill="#f5f9fb">WEBSITE-PITCH-PIPELINE</text>
      <text x="47" y="112" font-size="14" letter-spacing="3" fill="#9CC3E0">AGENT-RUN DEMO-SITE PIPELINE &#183; 6 LOOPS &#183; 3 HUMAN GATES</text>
    </g>

    <!-- storefront homepage elevation -->
    <g stroke="#9CC3E0" fill="none" stroke-linecap="round">
      <rect x="42" y="132" width="520" height="186" stroke-width="2" pathLength="1" class="anim lw d2"/>
      <line x1="42" y1="154" x2="562" y2="154" stroke-width="1.2" pathLength="1" class="anim lw d2"/>
      <circle cx="58" cy="143" r="3.5" stroke-width="1.2" pathLength="1" class="anim lw d2"/>
      <circle cx="72" cy="143" r="3.5" stroke-width="1.2" pathLength="1" class="anim lw d2"/>
      <circle cx="86" cy="143" r="3.5" stroke-width="1.2" pathLength="1" class="anim lw d2"/>
      <rect x="100" y="138" width="150" height="10" rx="5" stroke-width="1" pathLength="1" class="anim lw d2"/>
      <!-- nav -->
      <rect x="58" y="162" width="72" height="14" stroke-width="1.2" pathLength="1" class="anim lw d3"/>
      <line x1="62" y1="176" x2="76" y2="162" stroke-width="0.8" pathLength="1" class="anim lw d3"/>
      <line x1="76" y1="176" x2="90" y2="162" stroke-width="0.8" pathLength="1" class="anim lw d3"/>
      <line x1="90" y1="176" x2="104" y2="162" stroke-width="0.8" pathLength="1" class="anim lw d3"/>
      <line x1="430" y1="169" x2="452" y2="169" stroke-width="2" pathLength="1" class="anim lw d3"/>
      <line x1="462" y1="169" x2="484" y2="169" stroke-width="2" pathLength="1" class="anim lw d3"/>
      <line x1="494" y1="169" x2="516" y2="169" stroke-width="2" pathLength="1" class="anim lw d3"/>
      <line x1="42" y1="182" x2="562" y2="182" stroke-width="1" opacity="0.5" pathLength="1" class="anim lw d3"/>
      <!-- menu-as-image box -->
      <rect x="340" y="196" width="185" height="96" stroke-width="2" pathLength="1" class="anim lw d4"/>
      <line x1="340" y1="196" x2="525" y2="292" stroke-width="1.2" pathLength="1" class="anim lw d4"/>
      <line x1="340" y1="292" x2="525" y2="196" stroke-width="1.2" pathLength="1" class="anim lw d4"/>
      <!-- missing CTA -->
      <rect x="58" y="254" width="105" height="30" rx="3" stroke-width="1.5"
            stroke-dasharray="5 4" class="anim fade d4"/>
      <!-- footer -->
      <line x1="42" y1="300" x2="562" y2="300" stroke-width="1" opacity="0.5" pathLength="1" class="anim lw d5"/>
    </g>
    <!-- filled wireframe bars -->
    <g fill="#9CC3E0" class="anim fade d3">
      <rect x="58" y="196" width="250" height="9" rx="4" opacity="0.9"/>
      <rect x="58" y="213" width="190" height="9" rx="4" opacity="0.9"/>
      <rect x="58" y="232" width="150" height="4" rx="2" opacity="0.6"/>
      <rect x="58" y="306" width="60" height="6" rx="2" opacity="0.5"/>
      <rect x="130" y="306" width="60" height="6" rx="2" opacity="0.5"/>
    </g>

    <!-- broken phone -->
    <g stroke="#9CC3E0" fill="none" stroke-linecap="round">
      <rect x="580" y="150" width="56" height="114" rx="8" stroke-width="2" pathLength="1" class="anim lw d5"/>
      <line x1="580" y1="166" x2="636" y2="166" stroke-width="1" opacity="0.6" pathLength="1" class="anim lw d5"/>
      <polyline points="580,196 595,190 605,202 617,193 628,204 636,197" stroke-width="1.5"
                pathLength="1" class="anim lw d5"/>
      <rect x="595" y="214" width="72" height="16" stroke-width="1.5" pathLength="1" class="anim lw d5"/>
    </g>

    <!-- dimension line -->
    <g stroke="#9CC3E0" stroke-width="1" fill="none">
      <line x1="42" y1="322" x2="42" y2="337" pathLength="1" class="anim lw d6"/>
      <line x1="562" y1="322" x2="562" y2="337" pathLength="1" class="anim lw d6"/>
      <line x1="42" y1="331" x2="562" y2="331" pathLength="1" class="anim lw d6"/>
      <line x1="37" y1="336" x2="47" y2="326" stroke-width="1.5" pathLength="1" class="anim lw d6"/>
      <line x1="557" y1="336" x2="567" y2="326" stroke-width="1.5" pathLength="1" class="anim lw d6"/>
    </g>
    <text x="302" y="348" font-size="11" letter-spacing="2" fill="#9CC3E0" text-anchor="middle"
          class="anim fade d6">STOREFRONT ELEVATION &#8212; AS FOUND</text>

    <!-- north arrow + register marks -->
    <g stroke="#9CC3E0" fill="none" class="anim fade d5">
      <circle cx="870" cy="168" r="20" stroke-width="1.5"/>
      <path d="M870,153 L863,175 L870,169 L877,175 Z" fill="#9CC3E0" stroke="none"/>
      <text x="870" y="141" font-size="12" fill="#9CC3E0" text-anchor="middle" stroke="none">N</text>
      <g stroke-width="1" opacity="0.4">
        <line x1="712" y1="150" x2="728" y2="150"/><line x1="720" y1="142" x2="720" y2="158"/>
        <line x1="752" y1="315" x2="768" y2="315"/><line x1="760" y1="307" x2="760" y2="323"/>
      </g>
    </g>

    <!-- pencil annotations -->
    <g fill="#f5f9fb" font-size="16" font-weight="bold" letter-spacing="1" class="anim fade f4">
      <text x="180" y="272">NO CTA</text>
      <line x1="176" y1="267" x2="167" y2="270" stroke="#f5f9fb" stroke-width="1.2"/>
      <circle cx="165" cy="270" r="2.4"/>
      <text x="342" y="189">MENU IS A JPG</text>
      <text x="570" y="140">MOBILE BROKEN</text>
      <line x1="608" y1="144" x2="602" y2="156" stroke="#f5f9fb" stroke-width="1.2"/>
      <circle cx="601" cy="158" r="2.4"/>
    </g>

    <!-- title block, bottom-right of sheet -->
    <g class="anim fade d6">
      <rect x="642" y="248" width="290" height="100" fill="none" stroke="#9CC3E0" stroke-width="2"/>
      <g stroke="#9CC3E0" stroke-width="0.75" opacity="0.8">
        <line x1="642" y1="268" x2="932" y2="268"/>
        <line x1="642" y1="288" x2="932" y2="288"/>
        <line x1="642" y1="308" x2="932" y2="308"/>
        <line x1="642" y1="328" x2="932" y2="328"/>
        <line x1="790" y1="328" x2="790" y2="348"/>
      </g>
      <g font-size="11.5" fill="#f5f9fb" letter-spacing="0.5">
        <text x="650" y="262"><tspan fill="#9CC3E0">PROJECT:</tspan> WEBSITE-PITCH-PIPELINE</text>
        <text x="650" y="282"><tspan fill="#9CC3E0">FIRM:</tspan> PIIIX.org</text>
        <text x="650" y="302"><tspan fill="#9CC3E0">DRAWN BY:</tspan> AGENTS</text>
        <text x="650" y="322"><tspan fill="#9CC3E0">CHECKED BY:</tspan> HUMAN</text>
        <text x="650" y="342">SHEET 1 OF 7</text>
        <text x="798" y="342"><tspan fill="#9CC3E0">SCALE:</tspan> NTS</text>
      </g>
    </g>
  </g>

  <!-- tape on the sheet corners -->
  <g fill="#f5f9fb" opacity="0.15" class="anim fade f2">
    <rect x="40" y="18" width="60" height="22" transform="rotate(42 70 29)"/>
    <rect x="42" y="372" width="60" height="22" transform="rotate(-40 72 383)"/>
  </g>

  <!-- torn takeoff slip -->
  <g class="anim fade f3" transform="translate(950,155) rotate(2.5 140 85)">
    <rect x="7" y="9" width="272" height="162" fill="#000000" opacity="0.3"/>
    <path d="M0,0 H280 V160 L262,168 L246,160 L228,170 L210,162 L192,172 L174,163 L156,173
             L138,164 L120,174 L102,165 L84,175 L66,166 L48,174 L30,167 L14,175 L0,168 Z"
          fill="#f5f9fb"/>
    <g stroke="#272625" stroke-width="1" opacity="0.1">
      <line x1="14" y1="46" x2="266" y2="46"/>
      <line x1="14" y1="80" x2="266" y2="80"/>
      <line x1="14" y1="106" x2="266" y2="106"/>
    </g>
    <text x="22" y="36" font-size="13" letter-spacing="2" fill="#272625" opacity="0.75">TAKEOFF:</text>
    <text x="20" y="72" font-size="29" font-weight="bold" fill="#272625">$0.06&#8211;$32.25</text>
    <text x="22" y="98" font-size="15" font-weight="bold" fill="#272625" opacity="0.8">/ SAME JOB</text>
  </g>

  <!-- inspection stamp -->
  <g class="anim stampdrop" transform="translate(1002,258) rotate(-7 105 30)" opacity="0.94">
    <rect x="0" y="0" width="210" height="60" rx="8" fill="none" stroke="#B3402F" stroke-width="3"/>
    <rect x="5" y="5" width="200" height="50" rx="5" fill="none" stroke="#B3402F" stroke-width="1.2"/>
    <text x="105" y="37" font-size="17" font-weight="bold" letter-spacing="1.5" fill="#B3402F"
          text-anchor="middle">CHECKED: HUMAN</text>
  </g>

  <!-- carbon triplicate slip (bottom right, bleeding off edge) -->
  <g class="anim fade f3" transform="translate(1290,330) rotate(-4 120 60)">
    <rect x="16" y="14" width="250" height="140" fill="#EBDFB4"/>
    <rect x="8" y="7" width="250" height="140" fill="#E9CFC9"/>
    <rect x="0" y="0" width="250" height="140" fill="#f5f9fb"/>
    <text x="22" y="42" font-size="24" font-weight="bold" letter-spacing="3" fill="#272625">GATE A</text>
    <g fill="none" stroke="#272625" stroke-width="2">
      <rect x="22" y="56" width="13" height="13"/>
      <rect x="110" y="56" width="13" height="13"/>
    </g>
    <text x="42" y="68" font-size="13" font-weight="bold" fill="#272625">GO</text>
    <text x="130" y="68" font-size="13" font-weight="bold" fill="#272625">NO-GO</text>
  </g>
</svg>
