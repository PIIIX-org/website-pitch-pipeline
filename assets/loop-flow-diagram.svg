<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="300" fill="#0B0B0F"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif">
    Local Business Website Pitch Pipeline
  </text>

  <!-- Loop boxes -->
  <g id="loop-0a">
    <rect x="20" y="70" width="120" height="80" rx="8" fill="#6366F1" stroke="#818CF8" stroke-width="2"/>
    <text x="80" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif">Loop 0a</text>
    <text x="80" y="125" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Cost</text>
    <text x="80" y="138" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Estimate</text>
  </g>

  <g id="loop-0">
    <rect x="170" y="70" width="120" height="80" rx="8" fill="#6366F1" stroke="#818CF8" stroke-width="2"/>
    <text x="230" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif">Loop 0</text>
    <text x="230" y="125" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Bootstrap</text>
    <text x="230" y="138" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Setup</text>
  </g>

  <g id="loop-1">
    <rect x="320" y="70" width="120" height="80" rx="8" fill="#6366F1" stroke="#818CF8" stroke-width="2"/>
    <text x="380" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif">Loop 1</text>
    <text x="380" y="125" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Research</text>
    <text x="380" y="138" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Excel</text>
    <text x="380" y="165" text-anchor="middle" font-size="11" fill="#F59E0B" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Gate A</text>
  </g>

  <g id="loop-2">
    <rect x="470" y="70" width="120" height="80" rx="8" fill="#6366F1" stroke="#818CF8" stroke-width="2"/>
    <text x="530" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif">Loop 2</text>
    <text x="530" y="125" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Plan</text>
    <text x="530" y="138" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Repos</text>
    <text x="530" y="165" text-anchor="middle" font-size="11" fill="#F59E0B" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Gate B</text>
  </g>

  <g id="loop-3">
    <rect x="620" y="70" width="120" height="80" rx="8" fill="#6366F1" stroke="#818CF8" stroke-width="2"/>
    <text x="680" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif">Loop 3</text>
    <text x="680" y="125" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Build</text>
    <text x="680" y="138" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Demos</text>
    <text x="680" y="165" text-anchor="middle" font-size="11" fill="#F59E0B" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Gate C</text>
  </g>

  <g id="loop-4">
    <rect x="770" y="70" width="120" height="80" rx="8" fill="#6366F1" stroke="#818CF8" stroke-width="2"/>
    <text x="830" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif">Loop 4</text>
    <text x="830" y="125" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Report</text>
    <text x="830" y="138" text-anchor="middle" font-size="11" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Push</text>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#818CF8"/>
    </marker>
  </defs>

  <line x1="140" y1="110" x2="170" y2="110" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="290" y1="110" x2="320" y2="110" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="110" x2="470" y2="110" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="110" x2="620" y2="110" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="740" y1="110" x2="770" y2="110" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Output labels -->
  <text x="80" y="220" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">Cost estimates</text>
  <text x="80" y="235" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">model choices</text>

  <text x="230" y="220" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">Tools &amp; MCP</text>
  <text x="230" y="235" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">verification</text>

  <text x="380" y="220" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">Leads (Excel)</text>
  <text x="380" y="235" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">scored, geo'd</text>

  <text x="530" y="220" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">GitHub repos</text>
  <text x="530" y="235" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">plans + docs</text>

  <text x="680" y="220" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">Live demo sites</text>
  <text x="680" y="235" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">+ email drafts</text>

  <text x="830" y="220" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">Campaign report</text>
  <text x="830" y="235" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">pushed to repo</text>

  <!-- Color legend -->
  <text x="20" y="280" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">Primary: Indigo #6366F1</text>
  <rect x="200" y="270" width="20" height="20" fill="#6366F1" stroke="#818CF8" stroke-width="1"/>

  <text x="250" y="280" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">Accent: Amber #F59E0B</text>
  <rect x="420" y="270" width="20" height="20" fill="#F59E0B" stroke="#FBBF24" stroke-width="1"/>
</svg>
