<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 150" role="img" aria-label="Red drafting stamp: REVISION 2 IN PROGRESS. Sheets 01 to 04 are the revision 1 process and will change. Not for production use until the revised set is issued.">
