<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.3"/>

  <!-- P - left column -->
  <g id="p">
    <rect x="30" y="50" width="15" height="100" fill="url(#grad)" rx="3"/>
    <circle cx="52.5" cy="70" r="22.5" fill="url(#grad)" opacity="0.8"/>
  </g>

  <!-- I - center column -->
  <g id="i">
    <rect x="92.5" y="50" width="15" height="100" fill="url(#grad)" rx="3"/>
  </g>

  <!-- I - right column (second I) -->
  <g id="i2">
    <rect x="155" y="50" width="15" height="100" fill="url(#grad)" rx="3"/>
  </g>

  <!-- X - decorative cross (subtle) -->
  <g id="x-accent" opacity="0.4">
    <line x1="110" y1="140" x2="130" y2="160" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="130" y1="140" x2="110" y2="160" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text label -->
  <text x="100" y="180" text-anchor="middle" font-size="10" fill="#6366F1" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">PIIIX-ORG</text>
</svg>
