<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="200" fill="#0B0B0F"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif">Brand Color Palette</text>

  <!-- Primary: Indigo -->
  <g id="primary">
    <rect x="30" y="60" width="120" height="100" rx="8" fill="#6366F1" stroke="#818CF8" stroke-width="1"/>
    <text x="90" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="monospace">#6366F1</text>
    <text x="90" y="155" text-anchor="middle" font-size="10" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Primary</text>
  </g>

  <!-- Secondary: Indigo Light -->
  <g id="secondary">
    <rect x="170" y="60" width="120" height="100" rx="8" fill="#818CF8" stroke="#A5B4FC" stroke-width="1"/>
    <text x="230" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="monospace">#818CF8</text>
    <text x="230" y="155" text-anchor="middle" font-size="10" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif">Accent</text>
  </g>

  <!-- Accent: Amber -->
  <g id="accent">
    <rect x="310" y="60" width="120" height="100" rx="8" fill="#F59E0B" stroke="#FBBF24" stroke-width="1"/>
    <text x="370" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000" font-family="monospace">#F59E0B</text>
    <text x="370" y="155" text-anchor="middle" font-size="10" fill="#78350F" font-family="system-ui, -apple-system, sans-serif">Energy</text>
  </g>

  <!-- Background: Near-black -->
  <g id="background">
    <rect x="450" y="60" width="120" height="100" rx="8" fill="#0B0B0F" stroke="#1F2937" stroke-width="2"/>
    <text x="510" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#D1D5DB" font-family="monospace">#0B0B0F</text>
    <text x="510" y="155" text-anchor="middle" font-size="10" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">Background</text>
  </g>

  <!-- WCAG Accessibility note -->
  <text x="30" y="185" font-size="9" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif">✓ WCAG AA compliant contrast ratios • Dark-first design • Accessible to colorblind users</text>
</svg>
