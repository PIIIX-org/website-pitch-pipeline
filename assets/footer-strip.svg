<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" role="img" aria-labelledby="ft-title">
  <title id="ft-title">Closing title block: end of set, sheet 7 of 7 — firm PIIIX.org, drawn by agents, checked by human, forged with git-a-profile, filed to runs/</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .lbl { fill: #9CC3E0; font-size: 10px; letter-spacing: 1.8px; }
    .val { fill: #f5f9fb; font-weight: bold; letter-spacing: 2px; }
    .anim { animation: stamp .45s ease-out .35s both; transform-box: fill-box; transform-origin: center; }
    @keyframes stamp { from { opacity: 0; transform: scale(1.14) rotate(-4deg); } to { opacity: 1; transform: scale(1) rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } }
  </style>

  <!-- charcoal field -->
  <rect width="1600" height="180" fill="#272625"/>

  <!-- quiet flourish: thin cyanotype rule closing the sheet above -->
  <line x1="40" y1="12" x2="1560" y2="12" stroke="#2E5C8A" stroke-width="1.2"/>
  <line x1="40" y1="8" x2="40" y2="16" stroke="#2E5C8A" stroke-width="1.2"/>
  <line x1="1560" y1="8" x2="1560" y2="16" stroke="#2E5C8A" stroke-width="1.2"/>

  <!-- title block: outer border -->
  <rect x="40" y="36" width="1520" height="108" fill="none" stroke="#f5f9fb" stroke-width="2.5"/>
  <!-- cell dividers -->
  <line x1="270"  y1="36" x2="270"  y2="144" stroke="#f5f9fb" stroke-width="1.25"/>
  <line x1="830"  y1="36" x2="830"  y2="144" stroke="#f5f9fb" stroke-width="1.25"/>
  <line x1="1090" y1="36" x2="1090" y2="144" stroke="#f5f9fb" stroke-width="1.25"/>
  <line x1="1330" y1="36" x2="1330" y2="144" stroke="#f5f9fb" stroke-width="1.25"/>

  <!-- cell 1: end of set -->
  <text class="lbl" x="56" y="57">END OF SET</text>
  <text class="val" x="56" y="100" font-size="18">SHEET 7 OF 7</text>

  <!-- cell 2: firm -->
  <text class="lbl" x="286" y="57">FIRM</text>
  <text class="val" x="286" y="90" font-size="17">PIIIX.ORG</text>
  <text x="286" y="120" fill="#f5f9fb" font-size="12" letter-spacing="0.5">&#8220;OPEN-SOURCE, AI-NATIVE TOOLS FOR THE GAPS IN MATURE MARKETS.&#8221;</text>

  <!-- cell 3: drawn / checked, split row -->
  <line x1="830" y1="90" x2="1090" y2="90" stroke="#f5f9fb" stroke-width="1"/>
  <text class="lbl" x="846" y="57">DRAWN BY</text>
  <text class="val" x="846" y="80" font-size="15">AGENTS</text>
  <text class="lbl" x="846" y="110">CHECKED BY</text>
  <text class="val" x="846" y="133" font-size="15">HUMAN</text>

  <!-- cell 4: attribution -->
  <text class="lbl" x="1106" y="57">FORGED WITH</text>
  <text class="val" x="1106" y="100" font-size="15">GIT-A-PROFILE</text>

  <!-- cell 5: filed + stamp -->
  <text class="lbl" x="1346" y="57">FILED</text>
  <text class="val" x="1346" y="100" font-size="16" letter-spacing="1">runs/</text>
  <g class="anim" transform="rotate(-4 1478 94)">
    <rect x="1412" y="70" width="132" height="48" fill="#f5f9fb"/>
    <rect x="1420" y="77" width="116" height="34" fill="none" stroke="#B3402F" stroke-width="2" rx="3"/>
    <text x="1478" y="91"  text-anchor="middle" fill="#B3402F" font-size="10" font-weight="bold" letter-spacing="0.5">RUN NOT DONE</text>
    <text x="1478" y="104" text-anchor="middle" fill="#B3402F" font-size="10" font-weight="bold" letter-spacing="0.5">UNTIL FILED</text>
  </g>

  <!-- quiet flourish: turned-up last-page corner -->
  <polygon points="1552,180 1600,132 1600,180" fill="#0E2A3F"/>
  <line x1="1552" y1="180" x2="1600" y2="132" stroke="#9CC3E0" stroke-width="1.2"/>
</svg>
